<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mtr-board-enhanced</title>
  <style>
    :root {
      --bg: #efeee8;
      --panel: #f8f8f3;
      --frame: #ffffff;
      --text: #181818;
      --muted: #6c6c68;
      --line: #d7d7d1;
      --bar: #5d646a;
      --bar-text: #f8f8f6;
      --chip: #767d83;
      --footer: #ecece6;
      --alert: #8b2d2d;
      --good: #2e6f44;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      max-width: 1180px;
      margin: 0 auto;
    }
    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto auto;
      gap: 10px;
      margin-bottom: 14px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    select, button {
      height: 44px;
      border-radius: 10px;
      border: 1px solid #d1d1ca;
      padding: 0 12px;
      font-size: 16px;
      background: white;
    }
    button {
      cursor: pointer;
      font-weight: 700;
    }
    .primary { background: #1f2c36; color: white; }
    .board {
      background: var(--panel);
      border: 10px solid var(--frame);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,.08);
    }
    .hero {
      position: relative;
      padding: 24px 28px 12px;
      text-align: center;
      background: linear-gradient(to bottom, #f8f8f4 0%, #f4f4ef 100%);
    }
    .station-cn { font-size: 42px; font-weight: 800; letter-spacing: .03em; }
    .station-en { font-size: 24px; margin-top: 2px; }
    .clock {
      position: absolute;
      right: 22px;
      top: 20px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .clock-time { font-size: 24px; font-weight: 800; }
    .clock-date { font-size: 13px; color: var(--muted); }
    .linebar {
      background: var(--bar);
      color: var(--bar-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      font-size: 19px;
      font-weight: 600;
    }
    .linebar-center {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 3px solid #52595e;
      background: #f4f4ef;
      flex: 0 0 auto;
    }
    .statusbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: #f3f2ec;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e8e7e0;
      color: #333;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill.good { background: #dcecdf; color: #214f31; }
    .pill.warn { background: #f3dfdf; color: #7b2929; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .col { padding: 14px 22px 22px; }
    .train {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .platform {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: var(--chip);
      color: white;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .dest-cn { font-size: 27px; font-weight: 800; line-height: 1.05; }
    .dest-en { font-size: 17px; color: var(--muted); margin-top: 4px; }
    .meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .time {
      font-size: 38px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
    }
    .panel-footer {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      padding: 12px 18px;
      background: var(--footer);
      color: var(--muted);
      font-size: 16px;
      align-items: center;
      font-variant-numeric: tabular-nums;
    }
    .service-msg {
      margin: 12px 0 0;
      padding: 12px 14px;
      background: #f7eaea;
      color: #782c2c;
      border: 1px solid #e8c8c8;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }
    .weather {
      white-space: nowrap;
    }
    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .grid { grid-template-columns: 1fr; }
      .clock { position: static; text-align: center; margin-top: 12px; }
      .station-cn { font-size: 34px; }
      .station-en { font-size: 20px; }
      .dest-cn { font-size: 22px; }
      .time { font-size: 28px; }
      .linebar { font-size: 16px; }
      .panel-footer, .statusbar { grid-template-columns: 1fr; }
    }

    body.grayscale {
      filter: grayscale(1) contrast(1.04);
    }

    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .toggle-btn {
      min-width: 132px;
    }
    @media (max-width: 900px) {
      .top-actions { justify-content: stretch; }
      .toggle-btn { flex: 1 1 auto; }
    }
  </style>
</head>

    function buildStations(selectedLine) {
      const stations = lineMap[selectedLine].stations;
      stationEl.innerHTML = Object.entries(stations).map(([code, data]) => `<option value="${code}">${code} — ${data.cn} / ${data.en}</option>`).join('');
    }

      lineEl.value = line;
      buildStations(line);
      stationEl.value = sta;

      lineCnEl.textContent = lineData.cn;
      lineEnEl.textContent = lineData.en;

      stationEnEl.textContent = staData.en;

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateClock() {
      const now = new Date();
      document.getElementById('clockTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('clockDate').textContent = now.toLocaleDateString('en-GB', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatTime(s) {
      if (!s) return '--:--';
      var str = String(s).trim();
      var m = str.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
      if (!m) return '--:--';
      var year   = Number(m[1]);
      var month  = Number(m[2]) - 1;
      var day    = Number(m[3]);
      var hour   = Number(m[4]);
      var minute = Number(m[5]);
      var second = Number(m[6]);
      var d = new Date(year, month, day, hour, minute, second);
      if (isNaN(d.getTime())) return '--:--';
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function row(item, dirTextCn, dirTextEn) {
      const plat = item && item.plat ? item.plat : '-';
      const time = item && item.time ? formatTime(item.time) : '--:--';
      const extra = item && item.timetype ? 'Type: ' + item.timetype : 'Seq ' + ((item && item.seq) ? item.seq : '-');
      return `
        <div class="train">
          <div class="platform">${plat}</div>
          <div>
            <div class="dest-cn">${dirTextCn}</div>
            <div class="dest-en">${dirTextEn}</div>
            <div class="meta">${extra}</div>
          </div>
          <div class="time">${time}</div>
        </div>`;
    }

    function emptyRow() {
      return `
        <div class="train">
          <div class="platform">-</div>
          <div>
            <div class="dest-cn">暫無資料</div>
            <div class="dest-en">No data</div>
            <div class="meta">Waiting for update</div>
          </div>
          <div class="time">--:--</div>
        </div>`;
    }

    async function fetchWeather() {
      try {
        const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const data = await res.json();
        var temp = data && data.temperature && data.temperature.data && data.temperature.data[0] ? data.temperature.data[0].value : '--';
        var hum = data && data.humidity && data.humidity.data && data.humidity.data[0] ? data.humidity.data[0].value : '--';
        weatherEl.textContent = 'Weather: ' + temp + '°C / RH ' + hum + '%';
      } catch (e) {
        weatherEl.textContent = 'Weather: unavailable';
      }
    }

    async function fetchMtr() {
      const line = lineEl.value;
      const sta = stationEl.value;
      const api = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}&lang=TC`;
      const key = `${line}-${sta}`;
      const lineData = lineMap[line];
      apiStatusEl.textContent = 'API status: loading';
      apiStatusEl.className = 'pill';
      serviceMsgEl.style.display = 'none';
      serviceMsgEl.textContent = '';
      try {
        const res = await fetch(api);
        const json = await res.json();

        if (json.status === 0) {
          apiStatusEl.textContent = 'API status: alert';
          apiStatusEl.className = 'pill warn';
          serviceStateEl.textContent = 'Service alert';
          serviceMsgEl.style.display = 'block';
          serviceMsgEl.textContent = json.message || 'Special train service arrangements are in place.';
          leftEl.innerHTML = emptyRow();
          rightEl.innerHTML = emptyRow();
          updatedEl.textContent = 'Updated --:--';
          return;
        }

        const payload = json.data && json.data[key] ? json.data[key] : {};
        var up = payload.UP || [];
        var down = payload.DOWN || [];

        leftEl.innerHTML = (up.length ? up.slice(0,4) : [null]).map(function(item) {
          return item ? row(item, lineData.dir.up.cn, lineData.dir.up.en) : emptyRow();
        }).join('');

        rightEl.innerHTML = (down.length ? down.slice(0,4) : [null]).map(function(item) {
          return item ? row(item, lineData.dir.down.cn, lineData.dir.down.en) : emptyRow();
        }).join('');

        var delayed = json.isdelay === 'Y';
        apiStatusEl.textContent = delayed ? 'API status: delayed / limited data' : 'API status: normal';
        apiStatusEl.className = delayed ? 'pill warn' : 'pill good';
        serviceStateEl.textContent = delayed ? 'Delay / limited data' : 'Service normal';
        updatedEl.textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      } catch (e) {
        apiStatusEl.textContent = 'API status: error';
        apiStatusEl.className = 'pill warn';
        serviceStateEl.textContent = 'Connection error';
        leftEl.innerHTML = emptyRow();
        rightEl.innerHTML = emptyRow();
      }
    }

    function getFullscreenElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function syncFullscreenButton() {
      var active = !!getFullscreenElement();
      toggleFullscreenBtn.textContent = active ? 'Exit full screen' : 'Fit to screen';
    }

    async function enterFullscreen() {
      var elem = document.documentElement;
      try {
        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          await elem.webkitRequestFullscreen();
        } else {
          alert('Fullscreen is not supported on this iPad/browser.');
        }
      } catch (e) {
        alert('Unable to enter fullscreen on this iPad/browser.');
      }
    }

    async function exitFullscreen() {
      try {
        if (document.exitFullscreen && document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
          await document.webkitExitFullscreen();
        }
      } catch (e) {}
    }

    async function enableWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          toggleWakeBtn.textContent = 'Always on: On';
          wakeLock.addEventListener('release', function() {
            toggleWakeBtn.textContent = 'Always on: Off';
          });
        } else {
          alert('Wake Lock is not supported on this browser/device.');
        }
      } catch (e) {
        toggleWakeBtn.textContent = 'Always on: Off';
      }
    }

    async function disableWakeLock() {
      try {
        if (wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch (e) {}
      toggleWakeBtn.textContent = 'Always on: Off';
    }

    function syncButtons() {
      toggleThemeBtn.textContent = document.body.classList.contains('grayscale') ? 'Normal color mode' : 'Gray / night mode';
      toggleWakeBtn.textContent = wakeLock ? 'Always on: On' : 'Always on: Off';
    }

    toggleThemeBtn.addEventListener('click', function() {
      document.body.classList.toggle('grayscale');
      syncButtons();
      syncFullscreenButton();
    });

    toggleWakeBtn.addEventListener('click', async function() {
      if (wakeLock) {
        await disableWakeLock();
      } else {
        await enableWakeLock();
      }
      syncButtons();
      syncFullscreenButton();
    });

    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible' && wakeLock) {
        await enableWakeLock();
      }
    });

    toggleFullscreenBtn.addEventListener('click', async function() {
      if (getFullscreenElement()) {
        await exitFullscreen();
      } else {
        await enterFullscreen();
      }
      syncFullscreenButton();
    });

    document.addEventListener('fullscreenchange', syncFullscreenButton);
    document.addEventListener('webkitfullscreenchange', syncFullscreenButton);

    buildPresets();
    buildLines();
    buildStations('TCL');
    applySelection('TCL', 'TSY');
    fetchWeather();
    updateClock();

    presetEl.addEventListener('change', function() {
      var p = presets[Number(presetEl.value)];
      applySelection(p.line, p.sta);
    });
    lineEl.addEventListener('change', function() {
      buildStations(lineEl.value);
    });
    document.getElementById('apply').addEventListener('click', function() {
      applySelection(lineEl.value, stationEl.value);
    });
    document.getElementById('reloadNow').addEventListener('click', function() {
      fetchMtr();
      fetchWeather();
    });

    document.body.classList.add('grayscale');
    syncButtons();
    syncFullscreenButton();

    setInterval(updateClock, 1000);
    setInterval(fetchMtr, 15000);
    setInterval(fetchWeather, 600000);
    setTimeout(function() { location.reload(); }, 1800000);
  </script>
</body>
</html>
