<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MTR Next Trains — Colour &amp; Hong Kong First</title>

  <style>
    :root {
      --bg: #efeee8;
      --panel: #f8f8f3;
      --frame: #ffffff;
      --text: #181818;
      --muted: #6c6c68;
      --line: #d7d7d1;
      --bar: #f7943e;
      --bar-text: #181818;
      --chip: #767d83;
      --footer: #ecece6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body.grayscale {
      filter: grayscale(1) contrast(1.04);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin: -5px -5px 7px;
    }

    .top-actions button {
      margin: 5px;
    }

    .toggle-btn {
      min-width: 132px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto auto;
      grid-gap: 10px;
      margin-bottom: 14px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    select, button {
      height: 44px;
      border-radius: 10px;
      border: 1px solid #d1d1ca;
      padding: 0 12px;
      font-size: 16px;
      background: white;
      color: #181818;
    }

    select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #1f2c36;
      color: white;
    }

    .board {
      background: var(--panel);
      border: 10px solid var(--frame);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .08);
    }

    .hero {
      position: relative;
      padding: 24px 28px 12px;
      text-align: center;
      background: linear-gradient(
        to bottom, #f8f8f4 0%, #f4f4ef 100%
      );
    }

    .station-cn {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: .03em;
    }

    .station-en {
      font-size: 24px;
      margin-top: 2px;
    }

    .clock {
      position: absolute;
      right: 22px;
      top: 20px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .clock-time {
      font-size: 24px;
      font-weight: 800;
    }

    .clock-date {
      font-size: 13px;
      color: var(--muted);
    }

    .linebar {
      background: var(--bar);
      color: var(--bar-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      font-size: 19px;
      font-weight: 600;
    }

    .linebar-center {
      width: 34px;
      height: 34px;
      margin: 0 16px;
      border-radius: 999px;
      border: 3px solid rgba(0, 0, 0, .25);
      background: #f4f4ef;
      flex: 0 0 auto;
    }

    .statusbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      grid-gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: #f3f2ec;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e8e7e0;
      color: #333;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill.good {
      background: #dcecdf;
      color: #214f31;
    }

    .pill.warn {
      background: #f3dfdf;
      color: #7b2929;
    }

    /*
     * HTML order is always:
     * 1. DOWN: towards Hong Kong at Tsing Yi
     * 2. UP: towards Tung Chung at Tsing Yi
     */
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .col {
      padding: 14px 22px 22px;
    }

    .train {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) auto;
      grid-gap: 12px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .platform {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: var(--chip);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .dest-cn {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.05;
    }

    .dest-en {
      font-size: 17px;
      color: var(--muted);
      margin-top: 4px;
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .time {
      font-size: 38px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: .01em;
      text-align: right;
      white-space: nowrap;
    }

    .eta {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: #777;
      margin-top: 4px;
      letter-spacing: normal;
    }

    .panel-footer {
      display: grid;
      grid-template-columns: 1fr auto auto;
      grid-gap: 12px;
      padding: 12px 18px;
      background: var(--footer);
      color: var(--muted);
      font-size: 16px;
      align-items: center;
      font-variant-numeric: tabular-nums;
    }

    .service-msg {
      margin: 12px 0 0;
      padding: 12px 14px;
      background: #f7eaea;
      color: #782c2c;
      border: 1px solid #e8c8c8;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .controls > *,
    .statusbar > *,
    .panel-footer > *,
    .train > * {
      min-width: 0;
    }

    /* Stack in HTML order on phones and tablets. */
    @media (max-width: 900px) {
      .controls {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .grid {
        display: flex;
        flex-direction: column;
      }

      .grid > .col {
        width: 100%;
      }

      .col-up {
        border-top: 1px solid var(--line);
      }

      .clock {
        position: static;
        text-align: center;
        margin-top: 12px;
      }

      .station-cn {
        font-size: 34px;
      }

      .station-en {
        font-size: 20px;
      }

      .dest-cn {
        font-size: 22px;
      }

      .time {
        font-size: 28px;
      }

      .linebar {
        font-size: 16px;
      }

      .panel-footer,
      .statusbar {
        grid-template-columns: minmax(0, 1fr);
      }

      .toggle-btn {
        flex: 1 1 auto;
      }
    }

    /* iPhone portrait layout */
    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .app {
        width: 100%;
      }

      .top-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-gap: 8px;
        margin: 0 0 10px;
      }

      .top-actions button {
        margin: 0;
      }

      .toggle-btn {
        min-width: 0;
        width: 100%;
        padding: 0 6px;
        font-size: 13px;
      }

      #toggleFullscreen {
        grid-column: 1 / -1;
      }

      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-gap: 8px;
        margin-bottom: 10px;
      }

      .controls .field:first-child {
        grid-column: 1 / -1;
      }

      label {
        font-size: 12px;
      }

      select {
        font-size: 16px;
        padding: 0 8px;
      }

      .controls button {
        width: 100%;
        padding: 0 8px;
        font-size: 14px;
      }

      .board {
        border-width: 6px;
        border-radius: 14px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px 14px;
      }

      .station-cn {
        order: 1;
        font-size: 34px;
      }

      .station-en {
        order: 2;
        font-size: 20px;
      }

      .clock {
        order: 3;
        position: static;
        margin-top: 10px;
        text-align: center;
      }

      .clock-time {
        font-size: 22px;
      }

      .clock-date {
        font-size: 12px;
      }

      .linebar {
        padding: 9px 12px;
        font-size: 14px;
      }

      .linebar-center {
        width: 26px;
        height: 26px;
        margin: 0 8px;
        border-width: 2px;
      }

      .statusbar {
        grid-gap: 6px;
        padding: 10px;
        font-size: 12px;
      }

      .pill {
        max-width: 100%;
        white-space: normal;
      }

      .col {
        padding: 4px 12px 12px;
      }

      .col-up {
        padding-top: 10px;
      }

      .train {
        grid-template-columns: 40px minmax(0, 1fr) auto;
        grid-gap: 8px;
        padding: 12px 0;
      }

      .platform {
        width: 36px;
        height: 36px;
        font-size: 20px;
      }

      .dest-cn {
        font-size: 21px;
        line-height: 1.2;
        overflow-wrap: break-word;
      }

      .dest-en {
        font-size: 13px;
        line-height: 1.25;
        overflow-wrap: break-word;
      }

      .meta {
        font-size: 11px;
      }

      .time {
        font-size: 28px;
        line-height: 1.1;
      }

      .panel-footer {
        grid-gap: 5px;
        padding: 10px 12px;
        font-size: 12px;
      }

      .service-msg {
        font-size: 13px;
        padding: 10px 12px;
      }
    }

    @media (max-width: 360px) {
      .col {
        padding-left: 8px;
        padding-right: 8px;
      }

      .train {
        grid-template-columns: 34px minmax(0, 1fr) auto;
        grid-gap: 6px;
      }

      .platform {
        width: 32px;
        height: 32px;
        font-size: 18px;
      }

      .dest-cn {
        font-size: 19px;
      }

      .dest-en {
        font-size: 12px;
      }

      .time {
        font-size: 25px;
      }
    }
  </style>
</head>

<!-- Start in colour mode, not grayscale. -->
<body>
  <div class="app">
    <div class="top-actions">
      <button id="toggleTheme" class="toggle-btn primary">
        Gray / night mode
      </button>

      <button id="toggleWake" class="toggle-btn">
        Always on: Off
      </button>

      <button id="toggleFullscreen" class="toggle-btn">
        Fit to screen
      </button>
    </div>

    <div class="controls">
      <div class="field">
        <label for="preset">Quick preset</label>
        <select id="preset"></select>
      </div>

      <div class="field">
        <label for="line">Line code</label>
        <select id="line"></select>
      </div>

      <div class="field">
        <label for="station">Station code</label>
        <select id="station"></select>
      </div>

      <button id="apply" class="primary">Apply</button>
      <button id="reloadNow">Reload now</button>
    </div>

    <div class="board">
      <div class="hero">
        <div class="clock">
          <div class="clock-time" id="clockTime">--:--:--</div>
          <div class="clock-date" id="clockDate">----</div>
        </div>

        <div class="station-cn" id="stationCn">青衣</div>
        <div class="station-en" id="stationEn">Tsing Yi</div>
      </div>

      <div class="linebar">
        <div id="lineCn">東涌綫</div>
        <div class="linebar-center"></div>
        <div id="lineEn">Tung Chung Line</div>
      </div>

      <div class="statusbar">
        <div class="pill" id="apiStatus">API status: loading</div>
        <div class="pill" id="weather">Weather: --</div>
        <div class="pill">
          Auto refresh: 15s / full reload: 30m
        </div>
      </div>

      <!-- Hong Kong-bound section comes FIRST in the HTML. -->
      <div class="grid">
        <div class="col col-down">
          <div id="right"></div>
        </div>

        <div class="col col-up">
          <div id="left"></div>
        </div>
      </div>

      <div class="panel-footer">
        <div>MTR Next Trains</div>
        <div id="serviceState">Loading</div>
        <div id="updated">Updated --:--</div>
      </div>
    </div>

    <div class="service-msg" id="serviceMsg"></div>
  </div>

  <script>
    /*
     * Station data format:
     * CODE|Chinese name|English name
     */
    function makeLine(cn, en, stationText, upCn, upEn, downCn, downEn) {
      var stations = {};

      stationText.split(';').forEach(function(entry) {
        var parts = entry.split('|');

        stations[parts[0]] = {
          cn: parts[1],
          en: parts[2]
        };
      });

      return {
        cn: cn,
        en: en,
        stations: stations,
        dir: {
          up: {
            cn: upCn,
            en: upEn
          },
          down: {
            cn: downCn,
            en: downEn
          }
        }
      };
    }

    var lineMap = {

        '往機場 / 博覽館',

        '往東涌',

      TML: makeLine(

      EAL: makeLine(

        '往羅湖 / 落馬洲',
        'to Lo Wu / Lok Ma Chau',
        '往金鐘',
        'to Admiralty'
      ),

      SIL: makeLine(

        '往海怡半島',

      ),

      TWL: makeLine(

        '往荃灣',

        '往柴灣',
        'to Chai Wan',
        '往堅尼地城',
        'to Kennedy Town'
      ),

      KTL: makeLine(
        '觀塘綫',
        'Kwun Tong Line',
        'WHA|黃埔|Whampoa;HOM|何文田|Ho Man Tin;YMT|油麻地|Yau Ma Tei;MOK|旺角|Mong Kok;PRE|太子|Prince Edward;SKM|石硤尾|Shek Kip Mei;KOT|九龍塘|Kowloon Tong;LOF|樂富|Lok Fu;WTS|黃大仙|Wong Tai Sin;DIH|鑽石山|Diamond Hill;CHH|彩虹|Choi Hung;KOB|九龍灣|Kowloon Bay;NTK|牛頭角|Ngau Tau Kok;KWT|觀塘|Kwun Tong;LAT|藍田|Lam Tin;YAT|油塘|Yau Tong;TIK|調景嶺|Tiu Keng Leng',
        '往調景嶺',
        'to Tiu Keng Leng',
        '往黃埔',
        'to Whampoa'
      )
    };

    /* Display palette; colours are approximate. */
    var lineColors = {
      AEL: { background: '#00888A', text: '#FFFFFF' },
      TCL: { background: '#F7943E', text: '#181818' },
      TML: { background: '#9A3820', text: '#FFFFFF' },
      TKL: { background: '#A35EB5', text: '#FFFFFF' },
      EAL: { background: '#61B4E4', text: '#181818' },
      SIL: { background: '#B5BD00', text: '#181818' },
      TWL: { background: '#E2231A', text: '#FFFFFF' },
      ISL: { background: '#0071CE', text: '#FFFFFF' },
      KTL: { background: '#00AF41', text: '#181818' }
    };

    var presets = [
      { name: '東涌綫｜青衣 Tsing Yi', line: 'TCL', sta: 'TSY' },
      { name: '東涌綫｜荔景 Lai King', line: 'TCL', sta: 'LAK' },
      { name: '東涌綫｜香港 Hong Kong', line: 'TCL', sta: 'HOK' },
      { name: '機場快綫｜九龍 Kowloon', line: 'AEL', sta: 'KOW' },
      { name: '荃灣綫｜金鐘 Admiralty', line: 'TWL', sta: 'ADM' },
      { name: '東鐵綫｜金鐘 Admiralty', line: 'EAL', sta: 'ADM' }
    ];

    function el(id) {
      return document.getElementById(id);
    }

    var presetEl = el('preset');
    var lineEl = el('line');
    var stationEl = el('station');
    var leftEl = el('left');
    var rightEl = el('right');
    var apiStatusEl = el('apiStatus');
    var serviceStateEl = el('serviceState');
    var serviceMsgEl = el('serviceMsg');
    var updatedEl = el('updated');
    var themeBtn = el('toggleTheme');
    var wakeBtn = el('toggleWake');
    var fullscreenBtn = el('toggleFullscreen');

    var activeLine = 'TCL';
    var activeStation = 'TSY';
    var requestNumber = 0;
    var wakeLock = null;
    var wakeWanted = false;

    function pad(n) {
      return ('0' + n).slice(-2);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function updateLineColor(lineCode) {
      var colors = lineColors[lineCode] || {
        background: '#5D646A',
        text: '#FFFFFF'
      };

      document.documentElement.style.setProperty(
        '--bar', colors.background
      );

      document.documentElement.style.setProperty(
        '--bar-text', colors.text
      );
    }

    /*
     * Parse numeric date components explicitly.
     * A timestamp without a timezone is treated as Hong Kong time.
     */
    function parseTrainTime(value) {
      if (!value) return NaN;

      var match = String(value).trim().match(
        /^(\d{4})[-\/](\d{2})[-\/](\d{2})[T\s]+(\d{2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?(?:\s*(Z|[+-]\d{2}:?\d{2}))?$/i
      );

      if (!match) return NaN;

      var year = Number(match[1]);
      var month = Number(match[2]);
      var day = Number(match[3]);
      var hour = Number(match[4]);
      var minute = Number(match[5]);
      var second = Number(match[6] || 0);

      if (
        month < 1 || month > 12 ||
        day < 1 || day > 31 ||
        hour > 23 || minute > 59 || second > 59
      ) {
        return NaN;
      }

      var utc = Date.UTC(
        year, month - 1, day, hour, minute, second
      );

      var check = new Date(utc);

      if (
        check.getUTCFullYear() !== year ||
        check.getUTCMonth() !== month - 1 ||
        check.getUTCDate() !== day
      ) {
        return NaN;
      }

      var offsetMinutes = 480;
      var zone = match[7];

      if (zone && zone.toUpperCase() === 'Z') {
        offsetMinutes = 0;
      } else if (zone) {
        var cleanZone = zone.replace(':', '');
        var zoneHours = Number(cleanZone.slice(1, 3));
        var zoneMinutes = Number(cleanZone.slice(3, 5));

        if (zoneHours > 23 || zoneMinutes > 59) {
          return NaN;
        }

        offsetMinutes = (zoneHours * 60 + zoneMinutes) *
          (cleanZone.charAt(0) === '-' ? -1 : 1);
      }

      return utc - offsetMinutes * 60000;
    }

    function hongKongDate(timestamp) {
      return new Date(timestamp + 480 * 60000);
    }

    function formatTime(value) {
      var timestamp = parseTrainTime(value);

      if (isNaN(timestamp)) {
        return '--:--';
      }

      var date = hongKongDate(timestamp);

      return pad(date.getUTCHours()) + ':' +
             pad(date.getUTCMinutes());
    }

    function countdown(timestamp) {
      if (isNaN(timestamp)) return '';

      var remaining = timestamp - Date.now();

      if (remaining < -60000) return 'Departed';
      if (remaining < 60000) return 'Now';

      var minutes = Math.ceil(remaining / 60000);

      return 'in ' + minutes +
        (minutes === 1 ? ' min' : ' mins');
    }

    function updateCountdowns() {
      var nodes = document.querySelectorAll(
        '.eta[data-arrival]'
      );

      for (var i = 0; i < nodes.length; i++) {
        nodes[i].textContent = countdown(
          Number(nodes[i].getAttribute('data-arrival'))
        );
      }
    }

    function updateClock() {
      var now = hongKongDate(Date.now());

      var weekdays = [
        'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'
      ];

      var months = [
        'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
      ];

      el('clockTime').textContent =
        pad(now.getUTCHours()) + ':' +
        pad(now.getUTCMinutes()) + ':' +
        pad(now.getUTCSeconds());

      el('clockDate').textContent =
        weekdays[now.getUTCDay()] + ', ' +
        now.getUTCDate() + ' ' +
        months[now.getUTCMonth()] + ' ' +
        now.getUTCFullYear();

      updateCountdowns();
    }

    function addOption(select, value, label) {
      var option = document.createElement('option');

      option.value = value;
      option.textContent = label;

      select.appendChild(option);
    }

    function buildPresets() {
      presetEl.innerHTML = '';

      presets.forEach(function(preset, index) {
        addOption(presetEl, index, preset.name);
      });
    }

    function buildLines() {
      lineEl.innerHTML = '';

      Object.keys(lineMap).forEach(function(code) {
        var line = lineMap[code];

        addOption(
          lineEl,
          code,
          code + ' — ' + line.cn + ' / ' + line.en
        );
      });
    }

    function buildStations(code) {
      stationEl.innerHTML = '';

      Object.keys(lineMap[code].stations).forEach(
        function(stationCode) {
          var station = lineMap[code].stations[stationCode];

          addOption(
            stationEl,
            stationCode,
            stationCode + ' — ' +
            station.cn + ' / ' + station.en
          );
        }
      );
    }

    function emptyRow() {
      return '<div class="train">' +
        '<div class="platform">-</div>' +
        '<div>' +
          '<div class="dest-cn">暫無資料</div>' +
          '<div class="dest-en">No data</div>' +
          '<div class="meta">Waiting for update</div>' +
        '</div>' +
        '<div class="time">--:--</div>' +
      '</div>';
    }

    function row(item, direction) {
      var timestamp = parseTrainTime(item.time);

      var extra = item.timetype ?
        'Type: ' + item.timetype :
        'Seq ' + (item.seq || '-');

      var eta = isNaN(timestamp) ? '' :
        '<div class="eta" data-arrival="' + timestamp + '">' +
          escapeHtml(countdown(timestamp)) +
        '</div>';

      return '<div class="train">' +
        '<div class="platform">' +
          escapeHtml(item.plat || '-') +
        '</div>' +
        '<div>' +
          '<div class="dest-cn">' +
            escapeHtml(direction.cn) +
          '</div>' +
          '<div class="dest-en">' +
            escapeHtml(direction.en) +
          '</div>' +
          '<div class="meta">' +
            escapeHtml(extra) +
          '</div>' +
        '</div>' +
        '<div class="time">' +
          '<div>' + formatTime(item.time) + '</div>' +
          eta +
        '</div>' +
      '</div>';
    }

    function renderDirection(target, items, direction) {
      if (!Array.isArray(items) || !items.length) {
        target.innerHTML = emptyRow();
        return;
      }

      target.innerHTML = items.slice(0, 4).map(
        function(item) {
          return row(item, direction);
        }
      ).join('');
    }

    function setStatus(text, type) {
      apiStatusEl.textContent = 'API status: ' + text;
      apiStatusEl.className =
        'pill' + (type ? ' ' + type : '');
    }

    async function fetchMtr() {
      var thisRequest = ++requestNumber;
      var line = activeLine;
      var station = activeStation;
      var key = line + '-' + station;

      setStatus('loading', '');
      serviceMsgEl.style.display = 'none';

      try {
        var response = await fetch(
          'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php' +
          '?line=' + encodeURIComponent(line) +
          '&sta=' + encodeURIComponent(station) +
          '&lang=TC',
          { cache: 'no-store' }
        );

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        var json = await response.json();

        if (thisRequest !== requestNumber) {
          return;
        }

        if (Number(json.status) === 0) {
          setStatus('alert', 'warn');
          serviceStateEl.textContent = 'Service alert';

          serviceMsgEl.textContent =
            json.message ||
            'Train information is unavailable.';

          serviceMsgEl.style.display = 'block';

          leftEl.innerHTML = emptyRow();
          rightEl.innerHTML = emptyRow();
          updatedEl.textContent = 'Updated --:--';

          return;
        }

        var payload = json.data && json.data[key];

        if (!payload) {
          throw new Error('No station data in API response');
        }

        /*
         * The DOM order puts rightEl FIRST.
         * DOWN at Tsing Yi = towards Hong Kong.
         */
        renderDirection(
          rightEl,
          payload.DOWN || [],
          lineMap[line].dir.down
        );

        renderDirection(
          leftEl,
          payload.UP || [],
          lineMap[line].dir.up
        );

        var delayed = json.isdelay === 'Y';

        setStatus(
          delayed ? 'delayed / limited data' : 'normal',
          delayed ? 'warn' : 'good'
        );

        serviceStateEl.textContent =
          delayed ? 'Delay / limited data' : 'Service normal';

        var now = hongKongDate(Date.now());

        updatedEl.textContent =
          'Updated ' +
          pad(now.getUTCHours()) + ':' +
          pad(now.getUTCMinutes()) + ':' +
          pad(now.getUTCSeconds());

      } catch (error) {
        if (thisRequest !== requestNumber) {
          return;
        }

        setStatus('error', 'warn');
        serviceStateEl.textContent = 'Connection error';

        serviceMsgEl.textContent =
          'Unable to update train information: ' +
          error.message;

        serviceMsgEl.style.display = 'block';

        leftEl.innerHTML = emptyRow();
        rightEl.innerHTML = emptyRow();
        updatedEl.textContent = 'Updated --:--';

        if (window.console) {
          console.error(error);
        }
      }
    }

    async function fetchWeather() {
      try {
        var response = await fetch(
          'https://data.weather.gov.hk/weatherAPI/opendata/' +
          'weather.php?dataType=rhrread&lang=tc'
        );

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        var data = await response.json();

        var temperature =
          data.temperature &&
          data.temperature.data &&
          data.temperature.data[0] ?
          data.temperature.data[0].value : '--';

        var humidity =
          data.humidity &&
          data.humidity.data &&
          data.humidity.data[0] ?
          data.humidity.data[0].value : '--';

        el('weather').textContent =
          'Weather: ' + temperature +
          '°C / RH ' + humidity + '%';

      } catch (error) {
        el('weather').textContent = 'Weather: unavailable';
      }
    }

    function applySelection(line, station) {
      if (
        !lineMap[line] ||
        !lineMap[line].stations[station]
      ) {
        return;
      }

      activeLine = line;
      activeStation = station;

      lineEl.value = line;

      buildStations(line);
      stationEl.value = station;

      var lineData = lineMap[line];
      var stationData = lineData.stations[station];

      el('lineCn').textContent = lineData.cn;
      el('lineEn').textContent = lineData.en;
      el('stationCn').textContent = stationData.cn;
      el('stationEn').textContent = stationData.en;

      updateLineColor(line);

      /* Keep the preset menu consistent with the selection. */
      var presetIndex = -1;

      for (var i = 0; i < presets.length; i++) {
        if (
          presets[i].line === line &&
          presets[i].sta === station
        ) {
          presetIndex = i;
          break;
        }
      }

      presetEl.selectedIndex = presetIndex;

      leftEl.innerHTML = emptyRow();
      rightEl.innerHTML = emptyRow();

      fetchMtr();
    }

    function fullscreenElement() {
      return document.fullscreenElement ||
             document.webkitFullscreenElement ||
             null;
    }

    function syncFullscreenButton() {
      fullscreenBtn.textContent =
        fullscreenElement() ?
        'Exit full screen' : 'Fit to screen';
    }

    async function toggleFullscreen() {
      try {
        if (fullscreenElement()) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } else {
          var root = document.documentElement;

          if (root.requestFullscreen) {
            await root.requestFullscreen();
          } else if (root.webkitRequestFullscreen) {
            root.webkitRequestFullscreen();
          } else {
            alert(
              'Fullscreen is unavailable in this browser. ' +
              'On iPhone or iPad, try Safari → Share → ' +
              'Add to Home Screen, then open the saved icon.'
            );
          }
        }
      } catch (error) {
        alert(
          'Unable to change fullscreen mode: ' +
          error.message
        );
      }

      syncFullscreenButton();
    }

    function syncButtons() {
      themeBtn.textContent =
        document.body.classList.contains('grayscale') ?
        'Normal color mode' : 'Gray / night mode';

      wakeBtn.textContent =
        wakeLock && !wakeLock.released ?
        'Always on: On' : 'Always on: Off';
    }

    async function acquireWakeLock() {
      if (
        !wakeWanted ||
        document.visibilityState !== 'visible' ||
        (wakeLock && !wakeLock.released)
      ) {
        return;
      }

      try {
        var lock = await navigator.wakeLock.request('screen');

        if (!wakeWanted) {
          await lock.release();
          return;
        }

        wakeLock = lock;

        lock.addEventListener('release', function() {
          if (wakeLock === lock) {
            wakeLock = null;
          }

          syncButtons();
        });

      } catch (error) {
        wakeLock = null;
      }

      syncButtons();
    }

    themeBtn.addEventListener('click', function() {
      document.body.classList.toggle('grayscale');
      syncButtons();
    });

    wakeBtn.addEventListener('click', async function() {
      if (
        !navigator.wakeLock ||
        !navigator.wakeLock.request
      ) {
        alert(
          'Automatic screen wake lock is unavailable ' +
          'in this browser. You can instead adjust ' +
          'the device Auto-Lock setting.'
        );

        return;
      }

      wakeWanted = !wakeWanted;

      if (wakeWanted) {
        await acquireWakeLock();
      } else {
        var lock = wakeLock;
        wakeLock = null;

        if (lock) {
          try {
            await lock.release();
          } catch (error) {}
        }
      }

      syncButtons();
    });

    fullscreenBtn.addEventListener(
      'click',
      toggleFullscreen
    );

    document.addEventListener(
      'fullscreenchange',
      syncFullscreenButton
    );

    document.addEventListener(
      'webkitfullscreenchange',
      syncFullscreenButton
    );

    document.addEventListener(
      'visibilitychange',
      function() {
        if (document.visibilityState === 'visible') {
          updateClock();
          fetchMtr();

          if (wakeWanted) {
            acquireWakeLock();
          }
        }
      }
    );

    presetEl.addEventListener('change', function() {
      var preset = presets[Number(presetEl.value)];

      if (preset) {
        applySelection(preset.line, preset.sta);
      }
    });

    lineEl.addEventListener('change', function() {
      buildStations(lineEl.value);
    });

    el('apply').addEventListener('click', function() {
      applySelection(lineEl.value, stationEl.value);
    });

    el('reloadNow').addEventListener('click', function() {
      fetchMtr();
      fetchWeather();
    });

    buildPresets();
    buildLines();

    /* Always start at Tsing Yi on the Tung Chung Line. */
    applySelection('TCL', 'TSY');

    fetchWeather();
    updateClock();
    syncButtons();
    syncFullscreenButton();

    setInterval(updateClock, 1000);
    setInterval(fetchMtr, 15000);
    setInterval(fetchWeather, 600000);

    setTimeout(function() {
      location.reload();
    }, 1800000);
  </script>
</body>
</html>
