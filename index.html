<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTR Board</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2ee;
      color: #222;
    }

    .board {
      max-width: 1000px;
      margin: 20px auto;
      background: white;
      border: 8px solid white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      padding: 24px 16px 10px;
    }

    .header .cn {
      font-size: 42px;
      font-weight: bold;
    }

    .header .en {
      font-size: 24px;
    }

    .linebar {
      display: flex;
      justify-content: space-between;
      background: #5f666b;
      color: white;
      padding: 10px 18px;
      font-size: 18px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .column {
      padding: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 50px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .platform {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #777;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .dest-cn {
      font-size: 24px;
      font-weight: bold;
    }

    .dest-en {
      font-size: 16px;
      color: #666;
    }

    .time {
      font-size: 34px;
      font-weight: bold;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      background: #f0f0ea;
      color: #666;
      padding: 10px 16px;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
      .header .cn { font-size: 32px; }
      .time { font-size: 26px; }
      .dest-cn { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="header">
      <div class="cn">青衣</div>
      <div class="en">Tsing Yi</div>
    </div>

    <div class="linebar">
      <div>東涌綫</div>
      <div>Tung Chung Line</div>
    </div>

    <div class="content">
      <div class="column" id="left"></div>
      <div class="column" id="right"></div>
    </div>

    <div class="footer">
      <div>MTR Next Trains</div>
      <div id="updated">Updated --:--</div>
    </div>
  </div>

  <script>
    const apiUrl = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TCL&sta=TSY";

    function formatTime(dateString) {
      const d = new Date(dateString);
      if (isNaN(d)) return "--:--";
      return d.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    function createRow(platform, cn, en, time) {
      return `
        <div class="row">
          <div class="platform">${platform}</div>
          <div>
            <div class="dest-cn">${cn}</div>
            <div class="dest-en">${en}</div>
          </div>
          <div class="time">${time}</div>
        </div>
      `;
    }

    async function loadData() {
      try {
        const response = await fetch(apiUrl);
        const json = await response.json();

        const stationKey = "TCL-TSY";
        const up = json.data?.[stationKey]?.UP || [];
        const down = json.data?.[stationKey]?.DOWN || [];

        document.getElementById("left").innerHTML =
          down.slice(0, 4).map(item =>
            createRow("3", "往東涌", "to Tung Chung", formatTime(item.time))
          ).join("");

        document.getElementById("right").innerHTML =
          up.slice(0, 4).map(item =>
            createRow("4", "往香港", "to Hong Kong", formatTime(item.time))
          ).join("");

        document.getElementById("updated").textContent =
          "Updated " + new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          });
      } catch (error) {
        document.getElementById("left").innerHTML =
          createRow("-", "資料更新中", "Loading", "--:--");
        document.getElementById("right").innerHTML =
          createRow("-", "資料更新中", "Loading", "--:--");
      }
    }

    loadData();
    setInterval(loadData, 15000);
  </script>
</body>
</html>
